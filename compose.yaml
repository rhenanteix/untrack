services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arrume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.local}
      POSTGRES_DB: arrume_meu_link
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrume -d arrume_meu_link"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
